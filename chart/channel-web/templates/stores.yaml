# The channel's own database (drafts, consents, ownership) and session store. Neither is reachable
# from outside this namespace's BFF.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: channel-web-db
  labels: { app.kubernetes.io/name: channel-web-db, app.kubernetes.io/part-of: channel-web }
spec:
  serviceName: channel-web-db
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: channel-web-db }
  template:
    metadata:
      labels: { app.kubernetes.io/name: channel-web-db, app.kubernetes.io/part-of: channel-web }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        fsGroup: 70
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          env:
            - { name: POSTGRES_DB, value: channel_web }
            - { name: POSTGRES_USER, value: channel_web }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ .Values.secretName }}, key: db-password } }
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
          ports:
            - { name: postgres, containerPort: 5432 }
          readinessProbe:
            exec: { command: ["pg_isready", "-U", "channel_web"] }
            periodSeconds: 10
          resources: {{- toYaml .Values.postgres.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
            - { name: run, mountPath: /var/run/postgresql }
      volumes:
        - name: run
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: {{ .Values.postgres.storage }}
---
apiVersion: v1
kind: Service
metadata:
  name: channel-web-db
spec:
  selector: { app.kubernetes.io/name: channel-web-db }
  ports:
    - { name: postgres, port: 5432, targetPort: postgres }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: channel-web-redis
  labels: { app.kubernetes.io/name: channel-web-redis, app.kubernetes.io/part-of: channel-web }
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: channel-web-redis }
  template:
    metadata:
      labels: { app.kubernetes.io/name: channel-web-redis, app.kubernetes.io/part-of: channel-web }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: redis
          image: {{ .Values.redis.image }}
          args: ["--save", "", "--appendonly", "no", "--maxmemory", "48mb", "--maxmemory-policy", "volatile-lru"]
          ports:
            - { name: redis, containerPort: 6379 }
          resources: {{- toYaml .Values.redis.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: data, mountPath: /data }
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: channel-web-redis
spec:
  selector: { app.kubernetes.io/name: channel-web-redis }
  ports:
    - { name: redis, port: 6379, targetPort: redis }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: channel-web-stores
spec:
  podSelector:
    matchExpressions:
      - { key: app.kubernetes.io/name, operator: In, values: [channel-web-db, channel-web-redis] }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: { matchLabels: { app.kubernetes.io/name: channel-web } }
