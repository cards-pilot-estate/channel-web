name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build & test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build the SPA and the BFF, run every test
        run: ./mvnw -B verify
      - name: Container image builds
        run: docker build -f docker/Dockerfile -t channel-web:ci .
  chart:
    name: Chart lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.19.0
      - run: |
          helm lint chart/channel-web -f environments/dev.yaml
          helm lint chart/channel-web -f environments/uat.yaml
      - run: bash -n scripts/journey-test.sh
  publish:
    name: Publish image
    needs: [build, chart]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Package the jar
        run: ./mvnw -B -q package -DskipTests
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push (amd64 and arm64, SBOM and provenance)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            MODULE=channel-web
            REVISION=${{ github.sha }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/channel-web:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/channel-web:main
          sbom: true
          provenance: mode=max
